# uav_loop faz um gancho/laco de verdade (turn_schedule: reto por 2s,
# depois giro sustentado de omega=0.55 rad/s por 6s, ~3.3 rad ~ 189 graus -
# mais que uma curva em S, um laco que sobe, vira e desce cruzando a
# trajetoria reta de uav_straight de novo). Verificado numericamente:
# distancia minima entre os dois ~3m em t~8.1s (quase um cruzamento de
# verdade). Sem obstaculo - foco e a manobra em si sobre 3 estacoes.

simulation:
  duration: 10.0
  seed: 42

uavs:
  - name: uav_straight
    initial_state: [70.0, 0.0, 100.0, -14.0, 0.0, 0.0]
  - name: uav_loop
    initial_state: [10.0, -30.0, 100.0, 2.0, 15.0, 0.0]
    turn_schedule:
      - duration_s: 2.0
        omega: 0.0
      - duration_s: 6.0
        omega: 0.55

stations:
  - id: N
    position: [0.0, 70.0]
    frequency_hz: 60
    position_std: 2.0
    velocity_std: 0.5
  - id: SW
    position: [-70.0, -75.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: E
    position: [75.0, -10.0]
    frequency_hz: 20
    position_std: 2.0
    velocity_std: 0.5
