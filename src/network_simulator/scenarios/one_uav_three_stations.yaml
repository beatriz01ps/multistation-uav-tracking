# Cenario basico: 1 UAV observado por 3 estacoes com frequencias e ruido
# diferentes. Esperado apos estabilizar: um unico GlobalTrack consistente,
# nunca tres GlobalTracks permanentes para o mesmo alvo.

simulation:
  duration: 30.0
  seed: 42

uavs:
  - name: uav_1
    initial_state: [0.0, 0.0, 100.0, 10.0, 3.0, 0.0]

stations:
  - id: A
    frequency_hz: 60
    position_std: 2.0
    velocity_std: 0.5
  - id: B
    frequency_hz: 35
    position_std: 4.0
    velocity_std: 0.8
  - id: C
    frequency_hz: 20
    position_std: 6.0
    velocity_std: 1.0
