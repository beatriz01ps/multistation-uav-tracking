# Cenario 1 de geometria: trajetoria reta com uma estacao ao norte e duas
# ao sul, flanqueando o caminho do UAV (uma no inicio, outra perto do fim).
# Esperado: um unico GlobalTrack consistente, com as tres estacoes
# contribuindo ao longo do voo.

simulation:
  duration: 10.0
  seed: 42

uavs:
  - name: uav_1
    initial_state: [0.0, 50.0, 100.0, 10.0, 0.0, 0.0]

stations:
  - id: A
    position: [50.0, 90.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: B
    position: [20.0, 10.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: C
    position: [80.0, 10.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
