# Mesmo laco de loop_crossing.yaml, mas com uma SEGUNDA reta cruzando (as
# duas retas se cruzam em (0,0) em t=5s - mesmo padrao de
# multi_uav_crossing.yaml) e um obstaculo circular perto de onde as tres
# trajetorias se aproximam. Verificado numericamente: a estacao SW perde
# linha de visada em janelas diferentes para cada um dos 3 UAVs (laco em
# t~2.2-4.1s, uav_straight_1 em t~4.2-5.7s, uav_straight_2 de t~4.7s ate o
# fim) - as outras duas estacoes continuam com visada livre, sustentando
# os tracks durante essas janelas.

simulation:
  duration: 10.0
  seed: 42

uavs:
  - name: uav_straight_1
    initial_state: [70.0, 0.0, 100.0, -14.0, 0.0, 0.0]
  - name: uav_straight_2
    initial_state: [-70.0, -60.0, 100.0, 14.0, 12.0, 0.0]
  - name: uav_loop
    initial_state: [10.0, -30.0, 100.0, 2.0, 15.0, 0.0]
    turn_schedule:
      - duration_s: 2.0
        omega: 0.0
      - duration_s: 6.0
        omega: 0.55

stations:
  - id: N
    position: [0.0, 70.0]
    frequency_hz: 60
    position_std: 2.0
    velocity_std: 0.5
  - id: SW
    position: [-70.0, -75.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: E
    position: [75.0, -10.0]
    frequency_hz: 20
    position_std: 2.0
    velocity_std: 0.5

obstacles:
  - center: [0.0, 10.0]
    radius: 15.0
